[package]
name = "faves-cli"
description = "Command-line frontend for the Faves app."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "faves"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "color"] }
faves-schema.workspace = true
organiser-cli-kit.workspace = true
organiser-engine.workspace = true
serde_json.workspace = true
