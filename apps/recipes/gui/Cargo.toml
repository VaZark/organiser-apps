[package]
name = "recipes-gui"
description = "Graphical frontend for the Recipes app."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "recipes-gui"
path = "src/main.rs"

[dependencies]
recipes-schema.workspace = true
iced.workspace = true
organiser-core.workspace = true
organiser-engine.workspace = true
organiser-ui.workspace = true
organiser-markdown.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
