[package]
name = "notes-cli"
description = "Command-line frontend for the Notes app."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "notes"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "color"] }
organiser-cli-kit.workspace = true
organiser-engine.workspace = true
serde_json.workspace = true
notes-schema.workspace = true
