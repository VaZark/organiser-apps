[package]
name = "notes-kirigami"
description = "Kirigami (Qt/KDE) frontend for the Notes app."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "notes-kirigami"
path = "src/main.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
notes-schema.workspace = true
organiser-core.workspace = true
organiser-engine.workspace = true
organiser-qt.workspace = true
organiser-sticky.workspace = true
serde_json.workspace = true

[build-dependencies]
cxx-qt-build = "0.10"
