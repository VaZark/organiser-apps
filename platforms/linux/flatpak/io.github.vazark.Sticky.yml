# Local Flatpak build of the Sticky Notes Kirigami (KDE) app (see platforms/README.md). Wayland only.
app-id: io.github.vazark.Sticky
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: sticky-kirigami-launch
finish-args:
  - --socket=wayland
  - --device=dri
  - --share=ipc
  # The databases of the apps it can link. The launcher points XDG_DATA_HOME at the host's, since
  # the sandbox's own would hide them.
  - --filesystem=xdg-data/notes
  - --filesystem=xdg-data/todo
  # The list of linked apps, shared by every app.
  - --filesystem=xdg-config/organiser
  # The tray icon (StatusNotifierItem): the host's tray is found by this name.
  - --talk-name=org.kde.StatusNotifierWatcher
  # "Start on login" and staying in the background go through the Background portal, which needs
  # no permission.
  # The Plasma colour scheme and style, read-only, so the app follows the desktop.
  - --filesystem=xdg-config/kdeglobals:ro
  # This app's own config directory: its settings (`config.ron`, written by Preferences).
  - --filesystem=xdg-config/io.github.vazark.Sticky
modules:
  - name: sticky
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/sticky/cargo
        # The SDK has Qt 6 as plain `qmake`.
        QMAKE: /usr/bin/qmake
    build-commands:
      # SQLite is built in: the apps need its full-text search and JSON support.
      - cargo build --release --locked -p sticky-kirigami --features organiser-engine/bundled
      - install -Dm755 target/release/sticky-kirigami /app/bin/sticky-kirigami
      - install -Dm755 platforms/linux/flatpak/sticky-kirigami-launch /app/bin/sticky-kirigami-launch
      - install -Dm644 platforms/linux/icon/io.github.vazark.Sticky.svg /app/share/icons/hicolor/scalable/apps/io.github.vazark.Sticky.svg
      - mkdir -p /app/share/applications && target/release/sticky-kirigami --print-desktop-entry | sed 's/^Exec=.*/Exec=sticky-kirigami-launch %u/' > /app/share/applications/io.github.vazark.Sticky.desktop
      - install -Dm644 platforms/linux/flatpak/io.github.vazark.Sticky.metainfo.xml /app/share/metainfo/io.github.vazark.Sticky.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        # .cargo holds a local-only patch to sibling checkouts the sandbox does not have; seed/
        # is local demo data.
        skip: [target, .git, .cargo, seed, .flatpak-builder, .flatpak-cache, build-dir]
