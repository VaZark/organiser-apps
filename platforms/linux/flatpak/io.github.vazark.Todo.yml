# Local Flatpak build of the Todo GUI (see platforms/README.md). Wayland only.
app-id: io.github.vazark.Todo
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: todo-gui-launch
finish-args:
  - --socket=wayland
  - --device=dri
  # The database the command line and the GUI share. The launcher points XDG_DATA_HOME at the
  # host's, since the sandbox's own would hide it.
  - --filesystem=xdg-data/todo:create
  # The toolkit's desktop-wide settings (scheme, accent, density), read-only.
  - --filesystem=xdg-config/iced-adaptive-design:ro
  # The list of apps linked to Sticky Notes, shared by every app. Finding and starting Sticky
  # Notes needs nothing more: it goes through the desktop portals (OpenURI).
  - --filesystem=xdg-config/organiser
modules:
  - name: todo
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/todo/cargo
    build-commands:
      # SQLite is built in: the apps need its full-text search and JSON support.
      - cargo build --release --locked -p todo-gui --features organiser-engine/bundled
      - install -Dm755 target/release/todo-gui /app/bin/todo-gui
      - install -Dm755 platforms/linux/flatpak/todo-gui-launch /app/bin/todo-gui-launch
      - install -Dm644 platforms/linux/icon/io.github.vazark.Todo.svg /app/share/icons/hicolor/scalable/apps/io.github.vazark.Todo.svg
      - mkdir -p /app/share/applications && target/release/todo-gui --print-desktop-entry | sed 's/^Exec=.*/Exec=todo-gui-launch %u/' > /app/share/applications/io.github.vazark.Todo.desktop
      - install -Dm644 platforms/linux/flatpak/io.github.vazark.Todo.metainfo.xml /app/share/metainfo/io.github.vazark.Todo.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        # .cargo holds a local-only patch to sibling checkouts the sandbox does not have; seed/
        # is local demo data.
        skip: [target, .git, .cargo, seed, .flatpak-builder, .flatpak-cache, build-dir]
