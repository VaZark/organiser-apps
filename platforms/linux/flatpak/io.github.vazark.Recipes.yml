# Local Flatpak build of the Recipes GUI (see platforms/README.md). Wayland only.
app-id: io.github.vazark.Recipes
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: recipes-gui-launch
finish-args:
  - --socket=wayland
  - --device=dri
  # The database the command line and the GUI share. The launcher points XDG_DATA_HOME at the
  # host's, since the sandbox's own would hide it.
  - --filesystem=xdg-data/recipes:create
  # The toolkit's desktop-wide settings (scheme, accent, density), read-only.
  - --filesystem=xdg-config/iced-adaptive-design:ro
modules:
  - name: recipes
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/recipes/cargo
    build-commands:
      # SQLite is built in: the apps need its full-text search and JSON support.
      - cargo build --release --locked -p recipes-gui --features organiser-engine/bundled
      - install -Dm755 target/release/recipes-gui /app/bin/recipes-gui
      - install -Dm755 platforms/linux/flatpak/recipes-gui-launch /app/bin/recipes-gui-launch
      - install -Dm644 platforms/linux/icon/io.github.vazark.Recipes.svg /app/share/icons/hicolor/scalable/apps/io.github.vazark.Recipes.svg
      - mkdir -p /app/share/applications && target/release/recipes-gui --print-desktop-entry | sed 's/^Exec=.*/Exec=recipes-gui-launch/' > /app/share/applications/io.github.vazark.Recipes.desktop
      - install -Dm644 platforms/linux/flatpak/io.github.vazark.Recipes.metainfo.xml /app/share/metainfo/io.github.vazark.Recipes.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        # .cargo holds a local-only patch to sibling checkouts the sandbox does not have; seed/
        # is local demo data.
        skip: [target, .git, .cargo, seed, .flatpak-builder, .flatpak-cache, build-dir]
