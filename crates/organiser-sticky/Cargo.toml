[package]
name = "organiser-sticky"
description = "Shared sticky-notes infra: the link registry, the per-item sticky flag, and finding the Sticky app."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
organiser-core.workspace = true
organiser-engine.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "0.8"
# The tray icon (StatusNotifierItem) over D-Bus, on a thread of its own: no Qt widgets, which the
# apps do not have (a tray made with Qt Labs aborts the start of a program built on QGuiApplication).
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[dev-dependencies]
notes-schema.workspace = true
todo-schema.workspace = true
rusqlite.workspace = true
