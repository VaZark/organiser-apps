[workspace]
resolver = "2"
members = ["crates/organiser-core", "crates/organiser-markdown", "crates/organiser-vault", "crates/organiser-engine", "crates/organiser-cli-kit", "apps/todo/schema", "apps/todo/cli", "apps/recipes/schema", "apps/recipes/cli", "apps/notes/schema", "apps/notes/cli", "crates/organiser-sticky", "apps/sticky/engine", "apps/sticky/cli", "crates/organiser-qt", "apps/todo/kirigami", "apps/notes/kirigami", "apps/recipes/kirigami", "apps/sticky/kirigami"]

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
organiser-core = { path = "crates/organiser-core" }
organiser-markdown = { path = "crates/organiser-markdown" }
organiser-vault = { path = "crates/organiser-vault" }
organiser-engine = { path = "crates/organiser-engine" }
todo-schema = { path = "apps/todo/schema" }
recipes-schema = { path = "apps/recipes/schema" }
notes-schema = { path = "apps/notes/schema" }
organiser-cli-kit = { path = "crates/organiser-cli-kit" }
organiser-sticky = { path = "crates/organiser-sticky" }
organiser-qt = { path = "crates/organiser-qt" }
sticky-engine = { path = "apps/sticky/engine" }
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Pinned by revision. To develop against a sibling checkout, copy `.cargo/config.toml.local-check`
# to `.cargo/config.toml` (ignored by git).
weaver = { git = "https://github.com/VaZark/weaver", rev = "d44d3c077b3da937307ed809f988f3aad0136ee2" }
