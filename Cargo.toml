[workspace]
resolver = "2"
members = ["crates/organiser-core", "crates/organiser-markdown", "crates/organiser-engine", "crates/organiser-cli-kit", "apps/todo/schema", "crates/organiser-ui", "apps/todo/cli", "apps/todo/gui", "apps/faves/schema", "apps/faves/cli", "apps/faves/gui", "apps/recipes/schema", "apps/recipes/cli", "apps/recipes/gui", "apps/notes/schema", "apps/notes/cli", "apps/notes/gui", "crates/organiser-sticky", "apps/sticky/engine", "apps/sticky/cli", "apps/sticky/gui"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
organiser-core = { path = "crates/organiser-core" }
organiser-markdown = { path = "crates/organiser-markdown" }
organiser-engine = { path = "crates/organiser-engine" }
todo-schema = { path = "apps/todo/schema" }
todo-cli = { path = "apps/todo/cli" }
faves-schema = { path = "apps/faves/schema" }
recipes-schema = { path = "apps/recipes/schema" }
notes-schema = { path = "apps/notes/schema" }
organiser-cli-kit = { path = "crates/organiser-cli-kit" }
organiser-ui = { path = "crates/organiser-ui" }
organiser-sticky = { path = "crates/organiser-sticky" }
sticky-engine = { path = "apps/sticky/engine" }
iced-adaptive-design = { git = "https://github.com/VaZark/iced-libadwaita", rev = "c61ccbe55b6655d95537c22bcaddd938f5125c4a" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "wayland", "advanced", "svg", "image", "tokio", "canvas"] }
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Pinned by revision. To develop against sibling checkouts, copy `.cargo/config.toml.local-check`
# to `.cargo/config.toml` (ignored by git).
weaver = { git = "https://github.com/VaZark/weaver", rev = "d44d3c077b3da937307ed809f988f3aad0136ee2" }
